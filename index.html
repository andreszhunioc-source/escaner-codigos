<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escáner">
<title>Escáner de códigos</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f3f4f6; color: #111827; touch-action: manipulation; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { background: #1f2937; color: #fff; padding: 14px 16px; font-size: 20px; font-weight: 700; text-align: center; }
  main { padding: 12px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { font-size: 20px; padding: 18px; border-radius: 14px; border: 2px solid #9ca3af; background: #fff; font-weight: 700; }
  .seg button.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn { font-size: 22px; padding: 18px; border: none; border-radius: 14px; background: #16a34a; color: #fff; font-weight: 700; width: 100%; display: block; text-align: center; }
  .btn.sec { background: #4b5563; }
  .btn:disabled { opacity: .5; }
  #camWrap { position: relative; width: 100%; background: #000; border-radius: 14px; overflow: hidden; display: none; aspect-ratio: 3 / 4; }
  #cam { width: 100%; height: 100%; object-fit: cover; }
  #camWrap .hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: #fff; background: rgba(0,0,0,.5); padding: 6px; font-size: 16px; }
  label { font-size: 17px; font-weight: 600; display: block; margin-bottom: 4px; }
  input, textarea { width: 100%; font-size: 20px; padding: 14px; border: 2px solid #d1d5db; border-radius: 12px; background: #fff; }
  textarea { min-height: 80px; resize: vertical; }
  .field { display: flex; flex-direction: column; }
  #msg { font-size: 18px; text-align: center; padding: 12px; border-radius: 12px; display: none; }
  #msg.ok { display: block; background: #dcfce7; color: #166534; }
  #msg.err { display: block; background: #fee2e2; color: #991b1b; }
  #msg.info { display: block; background: #e0e7ff; color: #3730a3; }
</style>
</head>
<body>
<header>Escáner de códigos</header>
<main>

  <div class="seg" id="tipoSeg">
    <button type="button" data-tipo="Bodega" class="on">Bodega</button>
    <button type="button" data-tipo="Medidor">Medidor</button>
  </div>

  <button type="button" id="btnScan" class="btn sec">📷 Escanear código de barras</button>
  <button type="button" id="btnQR" class="btn sec">🔳 Escanear QR</button>
  <label class="btn sec" style="cursor:pointer">📸 Tomar foto del código
    <input id="foto" type="file" accept="image/*" capture="environment" style="display:none">
  </label>

  <div id="camWrap">
    <video id="cam" playsinline muted autoplay></video>
    <div class="hint">Apunta la cámara al código</div>
  </div>
  <button type="button" id="btnStop" class="btn sec" style="display:none">Cerrar cámara</button>

  <div class="field">
    <label for="codigo">Código</label>
    <input id="codigo" autocomplete="off" placeholder="Código de barras o QR">
  </div>

  <div class="field" id="campoCantidad">
    <label for="cantidad">Cantidad</label>
    <input id="cantidad" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
  </div>

  <div class="field" id="campoLectura" style="display:none">
    <label for="lectura">Lectura</label>
    <input id="lectura" type="number" inputmode="decimal" step="any" placeholder="0.00">
  </div>

  <div class="field">
    <label for="usuario">Usuario</label>
    <input id="usuario" autocomplete="off" placeholder="Tu nombre">
  </div>

  <div class="field">
    <label for="notas">Notas</label>
    <textarea id="notas" placeholder="Observaciones (opcional)"></textarea>
  </div>

  <button type="button" id="btnGuardar" class="btn">💾 Guardar</button>
  <div id="msg"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function () {
  // ===== CONFIGURACIÓN =====
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxwMHvMzOD568HivJ0zTmKF6Wg3btNl3jpX_54dbVPX8aP6FIvmekKKLOFxEfMk9lhmKA/exec';
  const TOKEN = 'MI-TOKEN';
  const HOJA = 'Escaneos';

  const $ = id => document.getElementById(id);
  let tipo = 'Bodega';
  let stream = null, detector = null, zxingReader = null, scanning = false, rafId = null;
  let modo = 'barras';     // 'barras' (EAN-13 / Code 128) o 'qr'
  let ultimoLeido = null;  // { valor, formato } del último código leído

  function msg(texto, clase) {
    const m = $('msg');
    m.textContent = texto;
    m.className = clase;
  }

  // ----- Selector Tipo -----
  document.querySelectorAll('#tipoSeg button').forEach(b => {
    b.addEventListener('click', () => {
      tipo = b.dataset.tipo;
      document.querySelectorAll('#tipoSeg button').forEach(x => x.classList.toggle('on', x === b));
      $('campoCantidad').style.display = tipo === 'Bodega' ? '' : 'none';
      $('campoLectura').style.display = tipo === 'Medidor' ? '' : 'none';
    });
  });

  // ----- Formatos según el botón usado -----
  function formatosBD() {
    return modo === 'qr' ? ['qr_code'] : ['ean_13', 'code_128'];
  }
  function formatosZX() {
    return modo === 'qr'
      ? [ZXing.BarcodeFormat.QR_CODE]
      : [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.CODE_128];
  }
  function nombreFormato(valor, formatoBruto) {
    if (modo === 'qr' || formatoBruto === 'qr_code' || formatoBruto === 'QR_CODE') return 'QR';
    return detectarFormato(valor);
  }

  // ----- Cámara en vivo -----
  async function abrirCamara(m) {
    modo = m || 'barras';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg('Este navegador no permite usar la cámara. Usa "Tomar foto del código".', 'err');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
    } catch (e) {
      msg('No se pudo abrir la cámara. Revisa los permisos o usa "Tomar foto del código".', 'err');
      return;
    }
    const video = $('cam');
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* iOS puede requerir otro toque */ }
    $('camWrap').style.display = 'block';
    $('btnStop').style.display = 'block';
    $('btnScan').style.display = 'none';
    $('btnQR').style.display = 'none';
    scanning = true;
    msg(modo === 'qr' ? 'Buscando QR… acércalo con buena luz.' : 'Buscando código… acerca el código y con buena luz.', 'info');
    iniciarDeteccion();
  }

  function cerrarCamara() {
    scanning = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (zxingReader && zxingReader.reset) { try { zxingReader.reset(); } catch (e) {} }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    $('cam').srcObject = null;
    $('camWrap').style.display = 'none';
    $('btnStop').style.display = 'none';
    $('btnScan').style.display = 'block';
    $('btnQR').style.display = 'block';
  }

  function codigoEncontrado(valor, formato) {
    $('codigo').value = valor;
    ultimoLeido = { valor: valor, formato: formato };
    msg('Código leído: ' + valor + ' (' + formato + ')', 'info');
    cerrarCamara();
    if (navigator.vibrate) navigator.vibrate(150);
  }

  function iniciarDeteccion() {
    // Android / Chrome: BarcodeDetector nativo
    if ('BarcodeDetector' in window) {
      try {
        detector = new BarcodeDetector({ formats: formatosBD() });
        const video = $('cam');
        const loop = async () => {
          if (!scanning) return;
          try {
            const codes = await detector.detect(video);
            if (codes.length) {
              codigoEncontrado(codes[0].rawValue, nombreFormato(codes[0].rawValue, codes[0].format));
              return;
            }
          } catch (e) { /* frame aún no listo */ }
          rafId = requestAnimationFrame(loop);
        };
        loop();
        return;
      } catch (e) { /* cae a ZXing */ }
    }
    // iPhone / Safari u otros: ZXing (lee EAN-13, Code 128 y QR)
    usarZXing();
  }

  function usarZXing() {
    if (!window.ZXing) {
      msg('No se pudo cargar el lector de códigos. Revisa tu conexión o usa "Tomar foto del código".', 'err');
      cerrarCamara();
      return;
    }
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formatosZX());
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxingReader = new ZXing.BrowserMultiFormatReader(hints);
    zxingReader.decodeFromVideoElement('cam', (result, err) => {
      if (!scanning) return;
      if (result) {
        codigoEncontrado(result.getText(), nombreFormato(result.getText(), String(result.getBarcodeFormat())));
      }
    }).catch(() => msg('No se pudo iniciar el lector. Usa "Tomar foto del código".', 'err'));
  }

  $('btnScan').addEventListener('click', () => abrirCamara('barras'));
  $('btnQR').addEventListener('click', () => abrirCamara('qr'));
  $('btnStop').addEventListener('click', cerrarCamara);

  // ----- Leer código desde una foto (fallback fiable en iPhone) -----
  $('foto').addEventListener('change', async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    if (!window.ZXing) { msg('No se pudo cargar el lector de códigos. Revisa tu conexión.', 'err'); return; }
    msg('Leyendo la foto…', 'info');
    const url = URL.createObjectURL(file);
    try {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formatosZX());
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.BrowserMultiFormatReader(hints);
      const r = await reader.decodeFromImageUrl(url);
      codigoEncontrado(r.getText(), nombreFormato(r.getText(), String(r.getBarcodeFormat())));
    } catch (e) {
      msg('No se encontró ningún código en la foto. Acércate, enfoca bien y con buena luz, y vuelve a intentarlo.', 'err');
    } finally {
      URL.revokeObjectURL(url);
    }
  });

  // ----- Guardar -----
  $('btnGuardar').addEventListener('click', async () => {
    const codigo = $('codigo').value.trim();
    const cantidad = tipo === 'Bodega' ? $('cantidad').value.trim() : $('lectura').value.trim();
    const usuario = $('usuario').value.trim();
    const notas = $('notas').value.trim();

    if (!codigo) { msg('Escribe o escanea el código.', 'err'); return; }
    if (!cantidad) { msg(tipo === 'Bodega' ? 'Escribe la cantidad.' : 'Escribe la lectura.', 'err'); return; }
    if (!usuario) { msg('Escribe el usuario.', 'err'); return; }

    // Si el código vino de un escaneo, usamos el formato detectado; si se escribió a mano, lo deducimos.
    const formato = (ultimoLeido && ultimoLeido.valor === codigo)
      ? ultimoLeido.formato
      : detectarFormato(codigo);

    const payload = {
      token: TOKEN,
      hoja: HOJA,
      fecha: new Date().toISOString(),
      tipo: tipo,
      codigo: codigo,
      formato: formato,
      cantidad: cantidad,
      usuario: usuario,
      notas: notas
    };

    const btn = $('btnGuardar');
    btn.disabled = true;
    msg('Guardando…', 'info');
    try {
      // no-cors: Apps Script no permite leer la respuesta desde otro dominio.
      // Esperamos como máximo 4 s; si no responde, damos el envío por hecho
      // (la fila suele guardarse igual) para no dejar el botón bloqueado.
      const envio = fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      await Promise.race([envio, new Promise(r => setTimeout(r, 4000))]);
      msg('Enviado. Si no ves la fila en la hoja, revisa tu conexión.', 'ok');
      $('codigo').value = '';
      $('cantidad').value = '';
      $('lectura').value = '';
      $('notas').value = '';
      ultimoLeido = null;
    } catch (e) {
      msg('Error al guardar. Revisa tu conexión e inténtalo de nuevo.', 'err');
    } finally {
      btn.disabled = false;
    }
  });

  function detectarFormato(codigo) {
    if (/^\d{13}$/.test(codigo)) return 'EAN-13';
    return 'Code 128';
  }
})();
</script>
</body>
</html>
