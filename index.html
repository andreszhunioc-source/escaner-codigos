<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Escáner de códigos</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f6f8; color: #1d2530; touch-action: manipulation; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f5fbf; color: #fff; padding: 16px; text-align: center; font-size: 22px; font-weight: 700; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 520px; width: 100%; margin: 0 auto; }
  #videoWrap { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; border-radius: 12px; overflow: hidden; display: none; }
  #video { width: 100%; height: 100%; object-fit: cover; }
  .guide { position: absolute; left: 10%; right: 10%; top: 40%; height: 20%; border: 3px solid #ffd400; border-radius: 8px; pointer-events: none; }
  button { font-size: 22px; padding: 18px; border: none; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; }
  .btn-scan { background: #1f9d55; color: #fff; }
  .btn-stop { background: #c0392b; color: #fff; }
  .btn-save { background: #1f5fbf; color: #fff; }
  label { font-size: 18px; font-weight: 600; display: block; margin-bottom: 6px; }
  select, input, textarea { width: 100%; font-size: 22px; padding: 14px; border: 2px solid #c7d0db; border-radius: 10px; background: #fff; font-family: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  .field { display: flex; flex-direction: column; }
  #status { font-size: 20px; text-align: center; padding: 14px; border-radius: 10px; display: none; }
  .ok { background: #d4edda; color: #155724; display: block !important; }
  .err { background: #f8d7da; color: #721c24; display: block !important; }
  .info { background: #e2ecfa; color: #1f3d6b; display: block !important; }
</style>
</head>
<body>
<header>Escáner de códigos</header>
<main>
  <button class="btn-scan" id="btnStart">📷 Escanear código</button>

  <div id="videoWrap">
    <video id="video" playsinline muted autoplay></video>
    <div class="guide"></div>
  </div>
  <button class="btn-stop" id="btnStop" style="display:none">⏹ Detener cámara</button>

  <div class="field">
    <label for="tipo">Tipo</label>
    <select id="tipo">
      <option value="Bodega">Bodega</option>
      <option value="Medidor">Medidor</option>
    </select>
  </div>

  <div class="field">
    <label for="codigo">Código</label>
    <input id="codigo" inputmode="numeric" placeholder="EAN-13 o Code 128">
  </div>

  <div class="field">
    <label id="lblCant" for="cantidad">Cantidad</label>
    <input id="cantidad" inputmode="decimal" placeholder="0">
  </div>

  <div class="field">
    <label for="usuario">Usuario</label>
    <input id="usuario" placeholder="Tu nombre">
  </div>

  <div class="field">
    <label for="notas">Notas</label>
    <textarea id="notas" placeholder="Observaciones (opcional)"></textarea>
  </div>

  <button class="btn-save" id="btnSave">💾 Guardar</button>
  <div id="status"></div>
</main>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// ====== CONFIGURACIÓN ======
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzb0c6YHO0NaPo3BNvws072lHLwLDI8b-PgimamQ3i2MGcDpkhdDTYNiI5XlxzqXM6OvA/exec";
const TOKEN = "8utrPYnDNgYxMJHdYOuyIdQv";
const HOJA = "Escaneos";
// ===========================

const $ = (id) => document.getElementById(id);
const video = $("video");
let stream = null, rafId = null, zxingReader = null, detector = null, lastCode = "", lastTime = 0;

function showStatus(msg, cls) {
  const s = $("status");
  s.textContent = msg;
  s.className = cls;
}

// Etiqueta del campo cantidad/lectura según el tipo
$("tipo").addEventListener("change", () => {
  const medidor = $("tipo").value === "Medidor";
  $("lblCant").textContent = medidor ? "Lectura" : "Cantidad";
  $("cantidad").placeholder = medidor ? "Lectura del medidor" : "0";
});

function onCodeFound(code) {
  const now = Date.now();
  if (code === lastCode && now - lastTime < 2000) return;
  lastCode = code;
  lastTime = now;
  $("codigo").value = code;
  if (navigator.vibrate) navigator.vibrate(150);
  showStatus("Código leído: " + code, "ok");
  stopCamera();
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });
  } catch (e) {
    showStatus("No se pudo abrir la cámara. Revisa los permisos y que la página esté en HTTPS.", "err");
    return;
  }
  video.srcObject = stream;
  video.setAttribute("playsinline", "");
  await video.play();
  $("videoWrap").style.display = "block";
  $("btnStop").style.display = "block";
  $("btnStart").style.display = "none";
  showStatus("Apunta la cámara al código de barras", "info");

  if ("BarcodeDetector" in window) {
    // Android y navegadores con soporte nativo
    try {
      detector = new BarcodeDetector({ formats: ["ean_13", "code_128"] });
      scanLoopNative();
    } catch (e) {
      startZxing();
    }
  } else {
    // iPhone y otros: ZXing
    startZxing();
  }
}

function scanLoopNative() {
  const tick = async () => {
    if (!stream) return;
    try {
      const codes = await detector.detect(video);
      if (codes.length) onCodeFound(codes[0].rawValue);
    } catch (e) {}
    if (stream) rafId = requestAnimationFrame(tick);
  };
  tick();
}

function startZxing() {
  if (typeof ZXing === "undefined") {
    showStatus("No se cargó la librería de escaneo. Revisa la conexión.", "err");
    return;
  }
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.CODE_128
  ]);
  zxingReader = new ZXing.BrowserMultiFormatReader(hints);
  zxingReader.decodeFromVideoElement(video, (result) => {
    if (result) onCodeFound(result.getText());
  });
}

function stopCamera() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (zxingReader) { try { zxingReader.reset(); } catch (e) {} zxingReader = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  video.srcObject = null;
  $("videoWrap").style.display = "none";
  $("btnStop").style.display = "none";
  $("btnStart").style.display = "block";
}

$("btnStart").addEventListener("click", startCamera);
$("btnStop").addEventListener("click", () => { stopCamera(); showStatus("", ""); });

async function guardar() {
  const codigo = $("codigo").value.trim();
  const cantidad = $("cantidad").value.trim();
  const usuario = $("usuario").value.trim();
  const notas = $("notas").value.trim();
  const tipo = $("tipo").value;

  if (!codigo) return showStatus("Falta el código.", "err");
  if (!cantidad) return showStatus(tipo === "Medidor" ? "Falta la lectura." : "Falta la cantidad.", "err");
  if (!usuario) return showStatus("Falta el usuario.", "err");

  const payload = {
    token: TOKEN,
    hoja: HOJA,
    tipo: tipo,
    codigo: codigo,
    formato: "",
    cantidad: cantidad,
    usuario: usuario,
    notas: notas
  };

  $("btnSave").disabled = true;
  showStatus("Guardando…", "info");
  try {
    // text/plain evita el preflight CORS que Apps Script no admite
    const resp = await fetch(URL_APPS_SCRIPT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    });
    const data = await resp.json();
    if (data.ok) {
      showStatus("Guardado en fila " + data.fila, "ok");
      $("codigo").value = "";
      $("cantidad").value = "";
      $("notas").value = "";
      lastCode = "";
    } else {
      showStatus("Error: " + (data.error || "desconocido"), "err");
    }
  } catch (e) {
    showStatus("No se pudo enviar. Revisa tu conexión.", "err");
  } finally {
    $("btnSave").disabled = false;
  }
}

$("btnSave").addEventListener("click", guardar);
</script>
</body>
</html>
